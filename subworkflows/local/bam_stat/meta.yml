# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "bam_stat"
## TODO nf-core: Add a description of the subworkflow and list keywords
description: Sort SAM/BAM/CRAM file
keywords:
  - sort
  - bam
  - sam
  - cram
## TODO nf-core: Add a list of the modules and/or subworkflows used in the subworkflow
components:
  - samtools/sort
  - samtools/index
  - samtools/stats
  - samtools/idxstats
  - samtools/flagstat
## TODO nf-core: List all of the channels used as input with a description and their structure
input:
  - ch_bam:
      type: file
      description: |
        The input channel containing the BAM/CRAM/SAM files
        Structure: [ val(meta), path(bam) ]
      pattern: "*.{bam/cram/sam}"
## TODO nf-core: List all of the channels used as output with a descriptions and their structure
output:
  - stats:
      type: file
      description: |
        Channel containing detailed statistics (read counts, mapping quality, insert sizes, error rates, etc).
        Structure: [ val(meta), path(bam) ]
  - flagstat:
      type: file
      description: |
        Channel containing simple summary stats (total reads, mapped, properly paired, duplicates, etc).
        Structure: [ val(meta), path(bam) ]
  - idxstats:
      type: file
      description: |
        Channel reporting the number of reads aligned to each reference sequence
        Structure: [ val(meta), path(bam) ]


authors:
  - "@Anson-Zhu"
maintainers:
  - "@Anson-Zhu"
